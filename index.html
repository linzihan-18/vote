/* ============================================================
   2. 解析数据
   ============================================================ */
function parseData() {
  const lines = RAW_DATA.trim().split('\n');
  const sheets = [];
  let cur = null;
  lines.forEach(line => {
    if (line.startsWith('#')) {
      const parts = line.slice(1).split('|');
      cur = { name: parts[0], type: parts[1] || 'normal', rows: [] };
      sheets.push(cur);
    } else if (line.trim() && cur) {
      cur.rows.push(line.split('|'));
    }
  });
  return sheets.map(s => ({
    name: s.name,
    type: s.type,
    items: s.rows.map(r => {
      if (s.type === 'maint') {
        const price = Number(r[8]) || 0;
        const years = Number(r[7]) || 0;
        return {
          area: r[0], dept: r[1], name: r[2],
          cat: '维保', price, qty: years,
          total: +(price * years).toFixed(2), origin: '',
          note: [r[4], r[5], r[3] ? ('资产编号 ' + r[3]) : '', r[9]].filter(Boolean).join(' · ')
        };
      }
      const price = Number(r[4]) || 0;
      const qty = Number(r[5]) || 0;
      return {
        area: r[0], dept: r[1], name: r[2], cat: r[3],
        price, qty, total: +(price * qty).toFixed(2),
        origin: r[6], note: r[7] || ''
      };
    })
  }));
}

const SHEETS = parseData();
const TOTAL = SHEETS.reduce((n, s) => n + s.items.length, 0);

/* ============================================================
   3. 状态
   ============================================================ */
const state = { voter: { name: '' }, votes: {}, signData: '', activeSheet: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => { const v = Number(n); return isFinite(v) ? String(Math.round(v * 100) / 100) : String(n == null ? '' : n); };
const fmtDateTime = (d = new Date()) => {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
};
const voteKey = (si, ri) => si + '-' + ri;

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'vote') renderVote();
  if (name === 'done') renderDone();
  if (name === 'admin') renderAdmin();
  window.scrollTo(0, 0);
}
function getStats() {
  let yes = 0, no = 0, abstain = 0, amount = 0;
  SHEETS.forEach((s, si) => s.items.forEach((it, ri) => {
    const v = state.votes[voteKey(si, ri)];
    if (v === 1) { yes++; amount += it.total; }
    else if (v === 0) no++;
    else abstain++;
  }));
  return { yes, no, abstain, amount: Math.round(amount * 100) / 100 };
}

    card.querySelectorAll('.vbtn').forEach(b => b.classList.toggle('active', +b.dataset.v === nv));

function batchOp(si, op) {
  const s = SHEETS[si];
  if (op === 'clear' && !confirm('确定清空本批次全部表决吗？')) return;
  s.items.forEach((it, ri) => {
    const k = voteKey(si, ri);
    if (op === 'yes') state.votes[k] = 1;
    else if (op === 'no') state.votes[k] = 0;
    else delete state.votes[k];
  });
  renderTabs(); renderSheetBody(si);
}

function initSignPad() {
  const canvas = document.getElementById('signPad');
  if (!canvas) return null;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 320, h = rect.height || 200;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111111';
  let drawing = false, ink = false;
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const down = e => { e.preventDefault(); drawing = true; ink = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = e => { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const up = () => { drawing = false; };
  canvas.addEventListener('touchstart', down, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', up);
  canvas.addEventListener('touchcancel', up);
  canvas.addEventListener('mousedown', down);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', up);
  canvas.addEventListener('mouseleave', up);
  return {
    hasInk: () => ink,
    clear() { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = '#111111'; ink = false; },
    toDataURL: () => canvas.toDataURL('image/png')
  };
}

async function doSubmit(pad) {
  if (!pad || !pad.hasInk()) { alert('请先手写签名'); return; }
  const btn = document.getElementById('btnDoSign');
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }

  state.signData = pad.toDataURL();
  const st = getStats();

  // 尝试提交到云端
  let cloudOk = false;
  if (CONFIG.supabaseUrl && CONFIG.supabaseKey) {
    try {
      const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/votes`, {
        method: 'POST',
        headers: {
          'apikey': CONFIG.supabaseKey,
          'Authorization': `Bearer ${CONFIG.supabaseKey}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          voter_name: state.voter.name,
          signature: state.signData,
          votes: state.votes,
          stats: st
        })
      });
      cloudOk = res.ok;
      if (!res.ok) {
        const t = await res.text();
        console.error('云端提交失败：', res.status, t);
      }
    } catch (e) {
      console.error('云端提交异常：', e);
    }
  }

  const modal = document.getElementById('signModal');
  if (modal) modal.remove();

  if (!cloudOk) {
    alert('提交到服务器失败，请检查网络后重试。\n（如管理员尚未配置服务器，请联系管理员）');
    return;
  }

  showView('done');
}

  let html = `
  <div style="text-align:center;padding:4mm 0 3mm;">
    <div style="font-size:17pt;font-weight:700;letter-spacing:3px;">设备委员会委员表决表</div>
    <div style="font-size:9pt;color:#666;margin-top:1.5mm;">2027年度设备购置计划</div>
  </div>
  <table style="width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:3mm;">
    <tr>
      <td style="padding:1.5mm 0;">委员姓名：<b>${esc(name)}</b></td>
      <td style="padding:1.5mm 0;text-align:right;">表决时间：${esc(time)}</td>
    </tr>
  </table>
  <div style="font-size:9pt;background:#f5f7fa;border:0.5pt solid #d5dae0;padding:2.5mm 3mm;margin-bottom:4mm;">
    表决汇总：共 ${TOTAL} 项 —
    <b style="color:#00843d;">同意 ${st.yes || 0} 项</b>，
    <b style="color:#c00000;">不同意 ${st.no || 0} 项</b>，
    <span style="color:#666;">弃权 ${st.abstain || 0} 项</span>。
    同意项目合计金额 <b>${st.amount || 0}</b> 万元。
  </div>`;

  SHEETS.forEach((s, si) => {
    const isMaint = s.type === 'maint';
    html += `
    <div style="margin-bottom:5mm;">
      <div style="font-size:10.5pt;font-weight:700;margin:0 0 1.5mm;padding-left:2mm;border-left:2.5pt solid #1565c0;">
        ${esc(s.name)}
        <span style="font-size:8.5pt;font-weight:400;color:#666;">（共 ${s.items.length} 项）</span>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:8pt;table-layout:fixed;">
        <thead><tr>
          <th style="${TH}width:8mm;">序号</th>
          <th style="${TH}width:11mm;">院区</th>
          <th style="${TH}width:26mm;">科室</th>
          <th style="${TH}">设备名称</th>
          <th style="${TH}width:15mm;">${isMaint ? '年度费用' : '单价'}<br>(万)</th>
          <th style="${TH}width:10mm;">${isMaint ? '年限' : '数量'}</th>
          <th style="${TH}width:15mm;">金额<br>(万)</th>
          <th style="${TH}width:14mm;">表决</th>
        </tr></thead><tbody>`;
    s.items.forEach((it, ri) => {
      const v = votes[voteKey(si, ri)];
      const txt = v === 1 ? '同意' : v === 0 ? '不同意' : '弃权';
      const color = v === 1 ? '#00843d' : v === 0 ? '#c00000' : '#888888';
      html += `<tr>
        <td style="${TD}text-align:center;">${ri + 1}</td>
        <td style="${TD}text-align:center;">${esc(it.area)}</td>
        <td style="${TD}">${esc(it.dept)}</td>
        <td style="${TD}">${esc(it.name)}${it.note ? `<div style="font-size:7pt;color:#888;margin-top:0.8mm;">${esc(it.note)}</div>` : ''}</td>
        <td style="${TD}text-align:right;">${fmt(it.price)}</td>
        <td style="${TD}text-align:center;">${it.qty}</td>
        <td style="${TD}text-align:right;">${fmt(it.total)}</td>
        <td style="${TD}text-align:center;color:${color};font-weight:700;">${txt}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });

  html += `
  <div style="margin-top:10mm;page-break-inside:avoid;">
    <table style="width:100%;border-collapse:collapse;">
      <tr>
        <td style="width:60%;vertical-align:bottom;padding-bottom:2mm;">
          <div style="font-size:10pt;margin-bottom:2mm;">委员签名：</div>
          ${sign ? `<img src="${sign}" style="max-height:22mm;max-width:80mm;border-bottom:0.5pt solid #999;padding-bottom:1mm;">` : '<div style="height:22mm;border-bottom:0.5pt solid #999;"></div>'}
        </td>
        <td style="width:40%;vertical-align:bottom;text-align:right;padding-bottom:2mm;font-size:10pt;">
          日期：${dateStr || fmtDateTime().slice(0, 10)}
        </td>
      </tr>
    </table>
  </div>
  <div style="margin-top:6mm;font-size:7.5pt;color:#999;text-align:center;">
    本表由设备委员会委员线上表决系统生成 · ${esc(time)} · 共 ${TOTAL} 项
  </div>`;
  div.innerHTML = html;
  return div;
}

async function exportOnePDF(id) {
  const rec = ADMIN_DATA.find(r => r.id === id);
  if (!rec) { alert('记录不存在'); return; }
  await generatePDF([rec], '设备委员会表决表_' + rec.voter_name + '.pdf');
}

async function exportAllPDF() {
  if (ADMIN_DATA.length === 0) { alert('暂无数据'); return; }
  await generatePDF(ADMIN_DATA, '设备委员会表决汇总_' + ADMIN_DATA.length + '人.pdf');
}

async function generatePDF(records, fileName) {
  if (typeof html2pdf === 'undefined') { alert('PDF 组件加载失败'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'loading-overlay';
  overlay.innerHTML = '<div class="spinner"></div><div>正在生成 PDF，请稍候…</div>';
  document.body.appendChild(overlay);

  const wrapper = document.createElement('div');
  records.forEach((rec, i) => {
    const node = buildReportNode(rec);
    if (i > 0) node.style.pageBreakBefore = 'always';
    wrapper.appendChild(node);
  });
  document.body.appendChild(wrapper);

  try {
    await new Promise(r => setTimeout(r, 400));
    await html2pdf().set({
      margin: [8, 8, 12, 8],
      filename: fileName,
      image: { type: 'jpeg', quality: 0.92 },
      html2canvas: { scale: 1.5, useCORS: true, logging: false, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: 'tr' }
    }).from(wrapper).save();
  } catch (e) {
    console.error(e);
    alert('PDF 生成失败：' + e.message);
  } finally {
    wrapper.remove();
    overlay.remove();
  }
}
